services:
  # Base de Datos MongoDB
  mongodb:
    image: mongo:7-jammy
    container_name: entrepanas-mongodb
    restart: unless-stopped
    # Solo accesible desde la máquina local (no expuesto a la red)
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: panasecreto
    volumes:
      - mongo_data:/data/db

  # Backend REST + WebSockets
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: entrepanas-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/panasecreto
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Valores leídos desde el archivo .env de la raíz (ver .env.example)
      JWT_KEY: ${JWT_KEY:?Define JWT_KEY en .env (openssl rand -hex 32)}
      USER_ADMIN_EMAIL: ${USER_ADMIN_EMAIL:-admin@panasecreto.local}
      USER_ADMIN_PASSWORD: ${USER_ADMIN_PASSWORD:?Define USER_ADMIN_PASSWORD en .env}
      CLOUD_NAME: ${CLOUD_NAME:-}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY:-}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET:-}
      FOLDER_NAME: ${FOLDER_NAME:-EntrePanas}
      MJ_APIKEY_PUBLIC: ${MJ_APIKEY_PUBLIC:-}
      MJ_APIKEY_PRIVATE: ${MJ_APIKEY_PRIVATE:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EntrePanas}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://entrepanas.app}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      - mongodb

  # Dashboard Web Administrativo
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: entrepanas-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
