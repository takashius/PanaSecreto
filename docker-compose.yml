services:
  # Base de Datos MongoDB
  mongodb:
    image: mongo:7-jammy
    container_name: panasecreto-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: panasecreto
    volumes:
      - mongo_data:/data/db

  # Backend REST + WebSockets
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: panasecreto-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/panasecreto
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Valores leídos desde el archivo .env de la raíz (ver .env.example)
      JWT_KEY: ${JWT_KEY:?Define JWT_KEY en .env (openssl rand -hex 32)}
      USER_ADMIN_EMAIL: ${USER_ADMIN_EMAIL:-admin@panasecreto.local}
      USER_ADMIN_PASSWORD: ${USER_ADMIN_PASSWORD:?Define USER_ADMIN_PASSWORD en .env}
      CLOUD_NAME: ${CLOUD_NAME:-}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY:-}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET:-}
      FOLDER_NAME: ${FOLDER_NAME:-PanaSecreto}
    depends_on:
      - mongodb

  # Dashboard Web Administrativo
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: panasecreto-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
