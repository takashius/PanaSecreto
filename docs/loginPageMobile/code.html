<!-- Festive & Playful Ambient Header -->
<div class="flex flex-col items-center justify-center text-center pt-space-md pb-space-md">
<!-- Mascot Container with subtle energetic glow -->
<div class="relative w-44 h-44 flex items-center justify-center mb-space-xs">
<div class="absolute inset-2 bg-secondary-fixed opacity-40 blur-2xl rounded-full"></div>
<img alt="PanaSecreto Guacamaya Mascota" class="relative z-10 w-full h-full object-contain filter drop-shadow-md select-none transform transition-transform hover:scale-105 active:scale-95 duration-200" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7TBegLjpgeNYZnrDoyYvgrp_xRnk3Y-RxmbglfUL2VqO0sqaFmdBCYgqxCtR22hSwjod7OG4JoZ38zBCnKsRwgxYuMGTE87ZsSxaEgudmlAMwcdthhmvfE5XvGHDbo7l0Kgat9pO0iIopCKBtNN4eSaOQG8CqjSLjc9sFVeQ6v_ALJTCM4Arfh7Yf-kKMLD-u7p71SvHRXJGApOsjr-1X1JmgWYe30cXMYj9XliQECOdWlL1F3yscPA"/>
</div>
<!-- Title & Welcoming Venezuelan Subtitle -->
<div class="flex items-center justify-center gap-1.5 mt-1">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Pana<span class="text-secondary font-black">Secreto</span></h1>
<span class="material-symbols-outlined text-secondary text-2xl animate-pulse" style="font-variation-settings: 'FILL' 1;">theater_comedy</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mt-1.5">
      ¡Epa! Inicia sesión para descubrir a tu amigo secreto y armar la parranda.
    </p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg p-space-lg flex flex-col gap-space-md mt-space-xs">
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Input: Email / Username -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold flex items-center gap-1.5" for="identifier">
<span>Correo o Usuario</span>
</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none">alternate_email</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface pl-11 pr-4 py-3.5 rounded-lg outline-none placeholder:text-outline/70" id="identifier" name="identifier" placeholder="ej. pana@correo.com o @carlos" required="" type="text"/>
</div>
</div>
<!-- Input: Password -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="password">
            Contraseña
          </label>
<button class="font-label-sm text-label-sm text-secondary hover:underline cursor-pointer active:opacity-80" type="button">
            ¿Olvidaste tu contraseña?
          </button>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-lg transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none">lock</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface pl-11 pr-11 py-3.5 rounded-lg outline-none placeholder:text-outline/70" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-3.5 text-outline hover:text-on-surface flex items-center justify-center p-1 rounded-full cursor-pointer transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-xl" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action CTA -->
<button class="w-full h-[52px] bg-secondary-container text-on-secondary-container font-headline-sm text-headline-sm font-bold rounded-lg shadow-md hover:shadow-lg active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-1 cursor-pointer" id="submitBtn" type="submit">
<span>Entrar al Intercambio</span>
<span class="text-xl leading-none">🎁</span>
</button>
</form>
<!-- Subtle Divider -->
<div class="relative flex items-center justify-center my-1">
<div class="w-full h-[1px] bg-surface-variant"></div>
<span class="absolute bg-surface-container-lowest px-3 font-label-sm text-label-sm text-outline uppercase tracking-wider">
        O ingresa con
      </span>
</div>
<!-- Social Login Buttons -->
<div class="flex flex-col gap-2.5">
<!-- Google Auth -->
<button class="w-full h-12 bg-surface-container-low hover:bg-surface-container active:scale-[0.99] rounded-lg flex items-center justify-center gap-3 text-on-surface font-label-lg text-label-lg transition-all cursor-pointer shadow-sm" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3h3.86c2.26-2.09 3.68-5.17 3.68-9.09z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z" fill="#EA4335"></path>
</svg>
<span>Continuar con Google</span>
</button>
<!-- Apple Auth -->
<button class="w-full h-12 bg-on-surface text-surface hover:opacity-95 active:scale-[0.99] rounded-lg flex items-center justify-center gap-3 font-label-lg text-label-lg transition-all cursor-pointer shadow-sm" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-2 .6-2.65 1.36-.58.67-1.09 1.74-.95 2.77 1 .08 2.05-.53 2.67-1.28"></path>
</svg>
<span>Continuar con Apple</span>
</button>
</div>
</div>
<!-- Registration Invitation Link -->
<div class="mt-space-lg text-center flex items-center justify-center gap-1.5">
<span class="font-body-md text-body-md text-on-surface-variant">¿Aún no eres parte?</span>
<button class="font-label-lg text-label-lg text-secondary font-bold hover:underline cursor-pointer" type="button">
      Regístrate aquí
    </button>
</div>
<!-- Trust & Confidentiality Assurance Badge -->
<div class="mt-space-md flex items-center justify-center">
<div class="inline-flex items-center gap-2 bg-surface-container px-3.5 py-1.5 rounded-full shadow-sm text-center">
<span class="material-symbols-outlined text-sm text-secondary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Anonimato 100% garantizado en cada sorteo</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (!pwdInput || !eyeIcon) return;
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    const btn = document.getElementById('submitBtn');
    if (!btn) return;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span><span>Cargando pana...</span>';
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.disabled = false;
    }, 1500);
  }
</script></main></body></html>
